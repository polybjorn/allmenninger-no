# The spellchecker is English-only, and the page copy is Nynorsk. Left
# unexcluded it flags ordinary words in every section, and each new language
# adds more.
[files]
extend-exclude = [
  "src/content/**",
  "src/i18n/ui/*.json",
  # The snapshot of her live site, and the thing copy.test.mjs measures the
  # build against. A spelling "fix" here would not correct the page, it would
  # move the target and make the test pass on text she never wrote.
  "test/fixtures/**",
]

# Norwegian words and names that survive outside src/content: the client's name
# in comments and the README, the section name the ported stylesheet uses, and
# the photo filenames.
[default.extend-words]
Lene = "Lene"
lene = "lene"
produkt = "produkt"
