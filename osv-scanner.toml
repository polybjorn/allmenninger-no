# Read by the CI dependency gate (bjorn/ci-actions osv-scan).

# A crafted extglob like +(*) makes picomatch backtrack exponentially. It comes
# in only through the build tooling (astro, vite, tinyglobby, fdir, anymatch),
# which matches this repo's own glob patterns at build time; the site ships no
# JavaScript at all, so no visitor input ever reaches it. No picomatch release
# fixes it yet (4.0.7 is both the latest and the last affected). The date makes
# the gate fail again, so the ignore is rechecked rather than kept for good.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-15
reason = "picomatch <= 4.0.7 is build-time only, through astro and vite matching this repo's own globs; the static site ships no JS, and no fixed release exists yet"
